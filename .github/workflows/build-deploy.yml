name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.deploy_check.outputs.can_deploy }}
    env:
      # Public build-time values, set under Settings > Secrets and variables > Variables.
      NEXT_PUBLIC_LOGIN_URL: ${{ vars.NEXT_PUBLIC_LOGIN_URL }}
      NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          include-hidden-files: true
          if-no-files-found: error
      - id: deploy_check
        name: Check whether deployment is configured
        env:
          HOST: ${{ secrets.NAMEHERO_HOST }}
          USER_NAME: ${{ secrets.NAMEHERO_USER }}
          KEY: ${{ secrets.NAMEHERO_KEY }}
          TARGET: ${{ secrets.NAMEHERO_PATH }}
        run: |
          if [ -n "$HOST" ] && [ -n "$USER_NAME" ] && [ -n "$KEY" ] && [ -n "$TARGET" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "NameHero secrets are not all set; skipping deployment." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: build
    if: needs.build.outputs.can_deploy == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - name: Install SFTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload over SFTP
        env:
          HOST: ${{ secrets.NAMEHERO_HOST }}
          USER_NAME: ${{ secrets.NAMEHERO_USER }}
          KEY: ${{ secrets.NAMEHERO_KEY }}
          TARGET: ${{ secrets.NAMEHERO_PATH }}
        # Files are added or replaced but never deleted, so a wrong path cannot wipe a directory.
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/namehero
          chmod 600 ~/.ssh/namehero
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          lftp -c "set sftp:connect-program 'ssh -a -x -i ~/.ssh/namehero'; open -u '$USER_NAME,' 'sftp://$HOST'; mirror --reverse --verbose out/ '$TARGET'"
          rm -f ~/.ssh/namehero
